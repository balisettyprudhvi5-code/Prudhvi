<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Bowling 3D — Smart Compress Mini Games</title>
<style>
  :root{ --accent:#7fff6e; --accent2:#3dffd0; --text:#e8e8f0; --muted:#6b6b7e; --border:#2a2a33; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#0d0d0f;color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;touch-action:none;}
  #wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column;}
  #hud{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:linear-gradient(180deg,rgba(15,15,18,.9),rgba(15,15,18,.5));z-index:5;flex-shrink:0;}
  .hud-group{display:flex;align-items:center;gap:8px;}
  .hud-pill{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:999px;padding:5px 10px;font-size:.75rem;font-family:'Space Mono',monospace;}
  .hud-pill b{color:var(--accent);}
  .icon-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;}
  .icon-btn:active{transform:scale(.9);}
  #frame-strip{display:flex;gap:2px;padding:4px 8px;background:rgba(0,0,0,.3);overflow-x:auto;flex-shrink:0;}
  .frame-box{min-width:34px;border:1px solid var(--border);border-radius:6px;padding:3px 4px;text-align:center;font-family:'Space Mono',monospace;font-size:.62rem;flex-shrink:0;background:rgba(255,255,255,.03);}
  .frame-box.active{border-color:var(--accent);}
  .frame-box .fscore{color:var(--accent2);font-weight:700;}
  #stage{position:relative;flex:1;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #power-bar-wrap{position:absolute;left:12px;bottom:110px;width:14px;height:140px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  #power-bar-fill{position:absolute;bottom:0;left:0;right:0;height:0%;background:linear-gradient(0deg,var(--accent),var(--accent2));}
  #spin-hint{position:absolute;right:12px;bottom:110px;font-family:'Space Mono',monospace;font-size:.7rem;color:var(--muted);text-align:right;}
  #overlay-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(6,6,8,.86);backdrop-filter:blur(8px);z-index:20;text-align:center;padding:24px;}
  #overlay-screen.hidden{display:none;}
  #overlay-screen h1{font-size:1.6rem;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  #overlay-screen p{color:var(--muted);font-size:.85rem;max-width:290px;line-height:1.5;}
  .big-btn{padding:13px 34px;border-radius:14px;border:1px solid var(--border);background:linear-gradient(90deg,var(--accent),var(--accent2));color:#08110a;font-weight:800;font-size:.95rem;cursor:pointer;box-shadow:0 8px 24px -8px rgba(127,255,110,.5);}
  .big-btn:active{transform:scale(.96);}
  #strike-banner{position:absolute;top:20%;left:50%;transform:translate(-50%,0);font-size:2rem;font-weight:900;letter-spacing:.05em;opacity:0;pointer-events:none;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 20px rgba(127,255,110,.4);}
  #strike-banner.show{animation:pop .9s ease forwards;}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6);}30%{opacity:1;transform:translate(-50%,-10px) scale(1.2);}70%{opacity:1;}100%{opacity:0;transform:translate(-50%,-25px) scale(1);}}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="hud-group">
      <div class="hud-pill">Frame <b id="hud-frame">1</b>/10</div>
      <div class="hud-pill">Score <b id="hud-score">0</b></div>
      <div class="hud-pill">🏆 <b id="hud-best">0</b></div>
    </div>
    <div class="hud-group">
      <button class="icon-btn" id="btn-sound">🔊</button>
      <button class="icon-btn" id="btn-fullscreen">⛶</button>
      <button class="icon-btn" id="btn-pause">⏸</button>
    </div>
  </div>
  <div id="frame-strip"></div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="power-bar-wrap"><div id="power-bar-fill"></div></div>
    <div id="spin-hint">Drag left/right<br>to curve throw</div>
    <div id="strike-banner"></div>
    <div id="overlay-screen">
      <h1 id="ov-title">Bowling 3D</h1>
      <p id="ov-text">Hold to charge power, drag left/right to add curve, then release to bowl. Full 10-frame tournament — strikes and spares chain bonus points!</p>
      <button class="big-btn" id="ov-primary">▶ Start Game</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var LS_BEST="mg_bowling_best", LS_SOUND="mg_bowling_sound";
function ls(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

var canvas=document.getElementById("game"), ctx=canvas.getContext("2d"), stage=document.getElementById("stage");
var DPR=Math.min(window.devicePixelRatio||1,2.5);
var W,H;
function resize(){
  W=stage.clientWidth; H=stage.clientHeight;
  canvas.width=W*DPR; canvas.height=H*DPR; canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);

var state={ soundOn: ls(LS_SOUND,"1")==="1", paused:false, running:false, best:parseInt(ls(LS_BEST,"0"),10)||0 };
document.getElementById("hud-best").textContent=state.best;

var actx=null;
function actxGet(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function beep(freq,dur,type,vol,slide){
  if(!state.soundOn) return;
  var a=actxGet(); if(!a) return;
  var o=a.createOscillator(), g=a.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+dur);
  g.gain.value=vol||.15; g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}
function sfxRoll(){ beep(120,0.4,"sawtooth",0.05,90); }
function sfxPinHit(n){ for(var i=0;i<Math.min(n,4);i++) setTimeout(function(){ beep(700+Math.random()*300,0.08,"square",0.06); }, i*40); }
function sfxStrike(){ [0,150,300].forEach(function(t,i){ setTimeout(function(){ beep(500+i*200,0.3,"triangle",0.15); },t); }); }
function vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* Frames scoring */
var frames = []; // each: {rolls:[], score:null}
function newFrames(){
  frames = [];
  for(var i=0;i<10;i++) frames.push({rolls:[], done:false});
}
var curFrame = 0;
var pinsStanding = 10;
function renderFrameStrip(){
  var el=document.getElementById("frame-strip");
  el.innerHTML="";
  frames.forEach(function(f,i){
    var box=document.createElement("div");
    box.className="frame-box"+(i===curFrame?" active":"");
    var rollsText = f.rolls.map(function(r,ri){
      if(r===10 && f.rolls.length===1) return "X";
      if(ri===1 && f.rolls[0]+r===10) return "/";
      return r===0?"-":r;
    }).join(" ");
    box.innerHTML = (i+1)+"<br>"+(rollsText||"&nbsp;")+"<br><span class='fscore'>"+(f.cum!=null?f.cum:"")+"</span>";
    el.appendChild(box);
  });
}
function recordRoll(pins){
  var f = frames[curFrame];
  f.rolls.push(pins);
  var isLastFrame = curFrame===9;
  if(!isLastFrame){
    if(f.rolls.length===1 && pins===10){ f.done=true; }
    else if(f.rolls.length===2){ f.done=true; }
  } else {
    if(f.rolls.length===2){
      var sum = f.rolls[0]+f.rolls[1];
      if(sum<10) f.done=true;
    }
    if(f.rolls.length===3) f.done=true;
  }
  computeScores();
  renderFrameStrip();
}
function computeScores(){
  var total=0;
  for(var i=0;i<10;i++){
    var f=frames[i];
    if(f.rolls.length===0){ f.cum=null; continue; }
    var frameScore=null;
    if(i<9){
      if(f.rolls[0]===10){
        var bonus = bonusRolls(i+1,2);
        if(bonus.length===2) frameScore = 10+bonus[0]+bonus[1];
      } else if(f.rolls.length===2 && f.rolls[0]+f.rolls[1]===10){
        var bonus2 = bonusRolls(i+1,1);
        if(bonus2.length===1) frameScore = 10+bonus2[0];
      } else if(f.rolls.length===2){
        frameScore = f.rolls[0]+f.rolls[1];
      }
    } else {
      if(f.rolls.length>0) frameScore = f.rolls.reduce(function(a,b){return a+b;},0);
    }
    if(frameScore!==null){ total+=frameScore; f.cum=total; } else { f.cum=null; }
  }
  state.score = total;
  document.getElementById("hud-score").textContent = total;
}
function bonusRolls(startFrame,count){
  var out=[];
  for(var i=startFrame;i<frames.length && out.length<count;i++){
    frames[i].rolls.forEach(function(r){ if(out.length<count) out.push(r); });
  }
  return out;
}
function advanceFrame(){
  var f = frames[curFrame];
  if(f.done){
    curFrame++;
    pinsStanding = 10;
    setupPins();
    if(curFrame>=10){ endGame(); return; }
  } else {
    // second roll of frame, pins stay knocked
    setupPins(true);
  }
  renderFrameStrip();
}

/* Pins: 10 in triangle, tracked knocked state */
var pins=[];
function setupPins(keepKnocked){
  var layout = [
    [0,0],[-1,1],[1,1],[-2,2],[0,2],[2,2],[-3,3],[-1,3],[1,3],[3,3]
  ];
  if(!keepKnocked){
    pins = layout.map(function(p){ return {x:p[0],y:p[1],knocked:false,fx:0,fy:0,rot:0}; });
  } else {
    pins.forEach(function(p){ p.fx=0; p.fy=0; p.rot = p.knocked?p.rot:0; });
  }
}
setupPins();

var ball = {x:0.5, y:0.92, curve:0, r:16, rolling:false, power:0, charging:false, vx:0, vy:0};
function resetBall(){ ball.x=0.5; ball.y=0.92; ball.rolling=false; ball.power=0; ball.charging=false; ball.vx=0; ball.vy=0; }

var chargeStart=0;
var dragStartX=null;
function getPos(e){
  var rect=canvas.getBoundingClientRect();
  var cx=e.touches?e.touches[0].clientX:e.clientX, cy=e.touches?e.touches[0].clientY:e.clientY;
  return {x:cx-rect.left,y:cy-rect.top};
}
stage.addEventListener("mousedown",function(e){ startCharge(getPos(e)); });
stage.addEventListener("touchstart",function(e){ e.preventDefault(); startCharge(getPos(e)); },{passive:false});
stage.addEventListener("mousemove",function(e){ if(ball.charging) updateCurve(getPos(e)); });
stage.addEventListener("touchmove",function(e){ e.preventDefault(); if(ball.charging) updateCurve(getPos(e)); },{passive:false});
stage.addEventListener("mouseup",function(){ releaseBall(); });
stage.addEventListener("touchend",function(e){ e.preventDefault(); releaseBall(); },{passive:false});

function startCharge(p){
  if(!state.running || state.paused || ball.rolling) return;
  ball.charging=true; chargeStart=Date.now(); dragStartX=p.x;
}
function updateCurve(p){
  if(dragStartX===null) return;
  ball.curve = Math.max(-1,Math.min(1,(p.x-dragStartX)/120));
}
function releaseBall(){
  if(!ball.charging) return;
  ball.charging=false;
  var held = Math.min(Date.now()-chargeStart, 1200);
  ball.power = 0.35 + (held/1200)*0.65;
  ball.rolling=true;
  ball.vy = -ball.power*0.028;
  ball.vx = ball.curve*0.006;
  sfxRoll(); vibrate(15);
  dragStartX=null;
}

function updatePinFall(){
  var ballPxX = ball.x, ballPxY = ball.y;
  pins.forEach(function(p){
    if(p.knocked) { p.rot += 0.15; return; }
    var px = 0.5 + p.x*0.045, py = 0.18 + p.y*0.055;
    var dx = ballPxX-px, dy = ballPxY-py;
    var dist = Math.sqrt(dx*dx+dy*dy);
    if(dist < 0.045 && ballPxY < py+0.05){
      p.knocked = true;
      p.fx = (Math.random()-0.5)*0.06 + ball.vx*3;
      p.fy = -0.02-Math.random()*0.02;
    }
  });
}

function frameOverCheck(){
  var knockedCount = pins.filter(function(p){return p.knocked;}).length;
  var newlyDown = knockedCount - (frames[curFrame]._lastCount||0);
  frames[curFrame]._lastCount = knockedCount;
  return knockedCount;
}

function ballFinished(){
  ball.rolling=false;
  var standing = frames[curFrame]._lastCount || 0;
  var pinsThisRoll = standing - (frames[curFrame]._prevCount||0);
  frames[curFrame]._prevCount = standing;
  recordRoll(pinsThisRoll);
  if(pinsThisRoll===10) { sfxStrike(); showStrikeBanner("STRIKE!"); vibrate([30,30,60]); }
  else if(frames[curFrame].rolls.length===2 && frames[curFrame].rolls[0]+frames[curFrame].rolls[1]===10 && curFrame<9){ showStrikeBanner("SPARE!"); vibrate(30); }
  sfxPinHit(pinsThisRoll);
  setTimeout(function(){ resetBall(); advanceFrame(); }, 900);
}
function showStrikeBanner(text){
  var el=document.getElementById("strike-banner");
  el.textContent=text; el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
}

function update(){
  if(!state.running||state.paused) return;
  if(ball.rolling){
    ball.y += ball.vy;
    ball.x += ball.vx;
    ball.x = Math.max(0.15,Math.min(0.85,ball.x));
    updatePinFall();
    if(ball.y <= 0.16 || ball.y > 1.05){
      ballFinished();
    }
  }
  pins.forEach(function(p){
    if(p.knocked){ p.x += p.fx*8; p.y += p.fy*8; p.fy += 0.01; }
  });
}

function drawLane(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0f1712"); g.addColorStop(1,"#08080a");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  var laneTopW = W*0.34, laneBotW = W*0.62;
  var laneTopY = H*0.12, laneBotY = H*1.0;
  var cx = W/2;
  ctx.save();
  var laneGrad = ctx.createLinearGradient(0,laneTopY,0,laneBotY);
  laneGrad.addColorStop(0,"#3a2a1c"); laneGrad.addColorStop(0.5,"#5a4128"); laneGrad.addColorStop(1,"#402e1c");
  ctx.beginPath();
  ctx.moveTo(cx-laneTopW/2,laneTopY);
  ctx.lineTo(cx+laneTopW/2,laneTopY);
  ctx.lineTo(cx+laneBotW/2,laneBotY);
  ctx.lineTo(cx-laneBotW/2,laneBotY);
  ctx.closePath();
  ctx.fillStyle=laneGrad; ctx.fill();
  // gloss streaks
  ctx.globalAlpha=0.15;
  for(var i=-3;i<=3;i++){
    ctx.beginPath();
    ctx.moveTo(cx+i*laneTopW/8,laneTopY);
    ctx.lineTo(cx+i*laneBotW/8,laneBotY);
    ctx.strokeStyle="#fff"; ctx.lineWidth=1;
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // gutters
  ctx.fillStyle="#151515";
  ctx.beginPath();
  ctx.moveTo(cx-laneTopW/2-14,laneTopY); ctx.lineTo(cx-laneTopW/2,laneTopY);
  ctx.lineTo(cx-laneBotW/2,laneBotY); ctx.lineTo(cx-laneBotW/2-22,laneBotY);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx+laneTopW/2+14,laneTopY); ctx.lineTo(cx+laneTopW/2,laneTopY);
  ctx.lineTo(cx+laneBotW/2,laneBotY); ctx.lineTo(cx+laneBotW/2+22,laneBotY);
  ctx.fill();

  return {cx:cx, laneTopW:laneTopW, laneBotW:laneBotW, laneTopY:laneTopY, laneBotY:laneBotY};
}

function laneToScreen(lane, nx, ny){
  var w = lane.laneTopW + (lane.laneBotW-lane.laneTopW)*ny;
  var y = lane.laneTopY + (lane.laneBotY-lane.laneTopY)*ny;
  var x = lane.cx + (nx-0.5)*w;
  return {x:x,y:y, scale: 0.5+ny*0.9};
}

function drawPins(lane){
  var order = pins.map(function(p,i){return {p:p,i:i};}).sort(function(a,b){ return (0.18+a.p.y*0.055)-(0.18+b.p.y*0.055); });
  order.forEach(function(o){
    var p=o.p;
    var nx = 0.5 + p.x*0.045, ny = 0.18 + p.y*0.055;
    var pos = laneToScreen(lane,nx,ny);
    var s = pos.scale*22;
    ctx.save();
    ctx.translate(pos.x,pos.y);
    if(p.knocked) ctx.rotate(p.rot);
    var alpha = p.knocked ? Math.max(0,1-(p.rot/2)) : 1;
    ctx.globalAlpha = alpha;
    var grad = ctx.createLinearGradient(-s*0.25,-s*0.9,s*0.25,s*0.1);
    grad.addColorStop(0,"#ffffff"); grad.addColorStop(0.6,"#e8e8f0"); grad.addColorStop(1,"#9a9aa5");
    ctx.beginPath();
    ctx.moveTo(-s*0.18,s*0.1);
    ctx.quadraticCurveTo(-s*0.3,-s*0.4,-s*0.08,-s*0.85);
    ctx.quadraticCurveTo(0,-s*0.95,s*0.08,-s*0.85);
    ctx.quadraticCurveTo(s*0.3,-s*0.4,s*0.18,s*0.1);
    ctx.closePath();
    ctx.fillStyle=grad; ctx.fill();
    ctx.fillStyle="#ff5c5c";
    ctx.fillRect(-s*0.15,-s*0.55,s*0.3,s*0.08);
    ctx.restore();
    ctx.globalAlpha=1;
  });
}

function drawBall(lane){
  var pos = laneToScreen(lane, ball.x, ball.y);
  var r = ball.r * (pos.scale);
  ctx.save();
  var g = ctx.createRadialGradient(pos.x-r*0.3,pos.y-r*0.3,r*0.1,pos.x,pos.y,r);
  g.addColorStop(0,"#c1fff2"); g.addColorStop(0.5,"#3dffd0"); g.addColorStop(1,"#0f6e5c");
  ctx.beginPath(); ctx.arc(pos.x,pos.y,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); ctx.ellipse(pos.x-r*0.3,pos.y-r*0.35,r*0.25,r*0.14,-0.5,0,Math.PI*2);
  ctx.fillStyle="rgba(255,255,255,.6)"; ctx.fill();
  ctx.restore();
}

function render(){
  var lane = drawLane();
  drawPins(lane);
  drawBall(lane);

  // charge power bar
  var fill = document.getElementById("power-bar-fill");
  if(ball.charging){
    var held = Math.min(Date.now()-chargeStart,1200);
    fill.style.height = (held/1200*100)+"%";
  } else if(!ball.rolling){
    fill.style.height = "0%";
  }
}

function loop(){
  update(); render();
  requestAnimationFrame(loop);
}

function endGame(){
  state.running=false;
  if(state.score>state.best){ state.best=state.score; lsSet(LS_BEST,state.best); }
  document.getElementById("hud-best").textContent=state.best;
  showOverlay("Game Complete! 🎳", "Final score: "+state.score+" / 300", "▶ Play Again");
}

var overlayEl=document.getElementById("overlay-screen");
function showOverlay(title,text,label){
  document.getElementById("ov-title").textContent=title;
  document.getElementById("ov-text").textContent=text;
  document.getElementById("ov-primary").textContent=label;
  overlayEl.classList.remove("hidden");
}
function hideOverlay(){ overlayEl.classList.add("hidden"); }

document.getElementById("ov-primary").addEventListener("click",function(){
  hideOverlay();
  newFrames(); curFrame=0; pinsStanding=10; setupPins(); resetBall();
  frames[0]._lastCount=0; frames[0]._prevCount=0;
  computeScores(); renderFrameStrip();
  document.getElementById("hud-frame").textContent="1";
  state.running=true; state.paused=false;
});

function togglePause(){
  if(!state.running) return;
  state.paused=!state.paused;
  document.getElementById("btn-pause").textContent=state.paused?"▶":"⏸";
  if(state.paused) showOverlay("Paused","Frame "+(curFrame+1)+"/10 — Score: "+state.score,"▶ Resume");
  else hideOverlay();
}
document.getElementById("btn-pause").addEventListener("click",togglePause);
document.getElementById("btn-sound").addEventListener("click",function(){
  state.soundOn=!state.soundOn; lsSet(LS_SOUND,state.soundOn?"1":"0");
  this.textContent=state.soundOn?"🔊":"🔇";
});
if(!state.soundOn) document.getElementById("btn-sound").textContent="🔇";
document.getElementById("btn-fullscreen").addEventListener("click",function(){
  var el=document.documentElement;
  if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); }
  else { (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); }
});

var frameObserver = setInterval(function(){
  document.getElementById("hud-frame").textContent = Math.min(curFrame+1,10);
},300);

resize();
newFrames(); computeScores(); renderFrameStrip();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
