<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>You're Offline — Smart Compress</title>
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #17171b;
    --border: #2a2a33;
    --accent: #7fff6e;
    --accent2: #3dffd0;
    --text: #e8e8f0;
    --muted: #6b6b7e;
    --mono: 'Space Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans), system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
  }
  .card {
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem 2rem;
  }
  .dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 16px var(--accent);
    margin: 0 auto 1.4rem;
  }
  h1 {
    font-family: var(--mono), monospace;
    font-size: 1.3rem;
    margin-bottom: .8rem;
  }
  p {
    color: var(--muted);
    font-size: .95rem;
    line-height: 1.6;
    margin-bottom: 1.6rem;
  }
  button {
    background: var(--accent);
    color: #0d0d0f;
    border: none;
    font-weight: 700;
    font-family: var(--sans), sans-serif;
    padding: .8rem 1.6rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: .9rem;
  }
  button:hover { background: var(--accent2); }
</style>
</head>
<body>
  <div class="card">
    <div class="dot" aria-hidden="true"></div>
    <h1>You're Offline</h1>
    <p>Smart Compress can't reach the network right now. Tools you've already opened may still work from cache — reconnect and reload to get back to the full app.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
